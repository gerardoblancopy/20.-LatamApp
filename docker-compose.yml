version: '3.8'

services:
  latam-app:
    build: .
    container_name: latam-app-container
    ports:
      - "7860:7860"
    environment:
      - PORT=7860
      - PYTHON_CMD=python3
    volumes:
      # Montar volúmenes locales para desarrollo (opcional)
      # - .:/app
      # - /app/node_modules
    restart: unless-stopped
